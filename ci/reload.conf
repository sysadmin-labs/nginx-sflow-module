# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# This module answers nothing over HTTP, so the probe cannot be a request
# whose body says the module is alive.  A server that lost the module still
# answers 200, and that is exactly the reload failure worth catching -- so
# the probe catches a datagram instead: it fires one request and waits for
# the agent to send a sample for it.  No datagram, no round.

RELOAD_COLLECTOR_PORT=$((PORT + 1))

RELOAD_HTTP="
    sflow_config_file $WORK/hsflowd.auto;"

RELOAD_SERVER="
        sflow on;

        location /probe {
            return 200 'probe';
        }"

RELOAD_EXPECT='sampled'

# sampling=1 so every request is sampled, polling=1 so a tick comes around
# quickly.  The agent re-reads this file on a tick, which also means a
# reload does not have to be told about it.
cat > "$WORK/hsflowd.auto" <<EOF
rev_start=1
sampling=1
polling=1
header=128
agentIP=127.0.0.1
collector=127.0.0.1 $RELOAD_COLLECTOR_PORT
rev_end=1
EOF

# A collector that writes one line per datagram and nothing else: what the
# datagram contains is ci/datagrams.sh's business, here only its arrival
# matters.  It ends by itself after ten minutes so that nothing is left
# running if this script is interrupted -- ci/reload.sh owns the trap.
: > "$WORK/samples.txt"
perl -e '
    use strict; use warnings;
    use IO::Socket::INET;
    my $port = shift;
    my $srv = IO::Socket::INET->new(LocalAddr => "127.0.0.1", LocalPort => $port,
                                    Proto => "udp", ReuseAddr => 1)
        or die "bind: $!\n";
    $| = 1;
    alarm 600;
    while (1) {
        my $pkt;
        $srv->recv($pkt, 65535) or next;
        print "datagram ", length($pkt), "\n";
    }
' "$RELOAD_COLLECTOR_PORT" >> "$WORK/samples.txt" 2>/dev/null &

sleep 1

reload_probe() {
	before=$(wc -l < "$WORK/samples.txt" 2>/dev/null || echo 0)

	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe" > /dev/null 2>&1 || true

	# The sample is handed to the agent in the log phase and leaves with
	# the next tick, a second later.
	i=0
	while [ "$i" -lt 8 ]; do
		after=$(wc -l < "$WORK/samples.txt" 2>/dev/null || echo 0)
		if [ "$after" -gt "$before" ]; then
			echo sampled
			return 0
		fi
		sleep 1
		i=$((i + 1))
	done
}
